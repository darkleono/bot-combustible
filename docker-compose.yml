# 🐳 DOCKER COMPOSE - Stack Oracle OCI Portainer
# Ruta base en servidor: /DATA/AppData/Bots/bot-combustible/

services:
  bot-combustible:
    build: .
    container_name: bot-combustible
    restart: always
    ports:
      - "3008:3008"
    volumes:
      # 📚 PERSISTENCIA DE SESIÓN
      - "/DATA/AppData/Bots/bot-combustible/auth:/app/bot_sessions"
      
      # 💾 BASE DE DATOS
      - "/DATA/AppData/Bots/bot-combustible/db/db.json:/app/db.json"
      
      # ⚙️ PERSISTENCIA DE CONFIGURACIÓN
      - "/DATA/AppData/Bots/bot-combustible/config/flows.config.json:/app/src/flows.config.json"
      
      # 📝 PERSISTENCIA DE REGISTROS
      - "/DATA/AppData/Bots/bot-combustible/logs:/app/logs"
      
    environment:
      - NODE_ENV=production
      - PORT=3008
      - TZ=America/Mexico_City
